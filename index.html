<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>袁石 · 作品集</title>
<meta name="description" content="袁石的编曲与混音作品集">
<style>
:root{
  --bg:#F7F6F3; --card:#FFFFFF; --ink:#1C1F24; --muted:#6A717C; --line:#E3E1DC;
  --accent:#1F3A5F; --accent-soft:#E8EDF3; --wave:#C9D1DC;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;font-size:15px;line-height:1.6}
.serif{font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}

header{background:var(--accent);color:#fff}
header .wrap{padding-top:64px;padding-bottom:48px}
.eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;opacity:.7}
h1{font-size:44px;font-weight:700;letter-spacing:.12em;margin-top:10px;line-height:1.15}
.role{margin-top:10px;font-size:16px;letter-spacing:.18em;opacity:.9}
.contact{margin-top:28px;display:flex;flex-wrap:wrap;gap:8px 24px;font-size:14px;opacity:.85}
.contact a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4)}

main .wrap{padding-top:44px;padding-bottom:64px}
section+section{margin-top:44px}
.sec-head{display:flex;align-items:baseline;gap:12px;border-left:4px solid var(--accent);padding:6px 0 6px 14px;background:linear-gradient(90deg,var(--accent-soft),rgba(232,237,243,0));margin-bottom:16px}
.sec-head h2{font-size:20px;font-weight:700;color:var(--accent);letter-spacing:.12em}
.sec-head span{font-size:13px;color:var(--muted)}

.track{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;grid-template-columns:44px 1fr;gap:6px 16px;align-items:center}
.track+.track{margin-top:12px}
.track.playing{border-color:var(--accent);box-shadow:0 2px 12px rgba(31,58,95,.08)}
.play{grid-row:span 2;width:44px;height:44px;border-radius:50%;border:none;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.play:hover{transform:scale(1.06)}
.play:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.play svg{width:16px;height:16px;fill:#fff}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;min-width:0}
.title{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tag{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 8px}
.note{font-size:13px;color:var(--muted)}
.time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wave{grid-column:2;height:44px;width:100%;cursor:pointer;display:block}
.head{min-width:0}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer .wrap{padding-top:20px;padding-bottom:28px}

@media (max-width:560px){
  h1{font-size:34px}
  header .wrap{padding-top:44px;padding-bottom:36px}
  .track{grid-template-columns:40px 1fr;padding:14px}
  .play{width:40px;height:40px}
  .meta{flex-direction:column;gap:2px}
  .title{white-space:normal}
}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="eyebrow">Portfolio 2026</div>
  <h1 class="serif">袁石</h1>
  <div class="role">编曲 · 混音 · 音乐制作</div>
  <div class="contact">
    <span>浙江音乐学院 · 音乐设计与制作</span>
    <span>杭州</span>
    <a href="mailto:yuanshi522@163.com">yuanshi522@163.com</a>
  </div>
</div></header>

<main><div class="wrap">
  <section>
    <div class="sec-head"><h2 class="serif">编曲作品</h2><span>Arrangement</span></div>
    <div id="arr"></div>
  </section>
  <section>
    <div class="sec-head"><h2 class="serif">混音作品</h2><span>Mixing</span></div>
    <div id="mix"></div>
  </section>
</div></main>

<footer><div class="wrap">© 2026 袁石　·　作品仅供求职展示，请勿转载</div></footer>

const TRACKS = {
  arr: [
    {id:'budianxing-gushi', title:'不典型故事', tags:['流行','编曲']},
    {id:'tiangong-dazhan', title:'天宫大战', tags:['配乐','编曲']}
  ],
  mix: [
    {id:'mantianxing', title:'满天星', tags:['分轨混音','母带'], note:'电视剧《爱上另一个我》插曲'},
    {id:'xianshi-taiweixian', title:'现实太危险', tags:['分轨混音']},
    {id:'meiyu-jijie', title:'没语季节', tags:['贴唱混音']}
  ]
};
const PLAY='<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>';
const PAUSE='<svg viewBox="0 0 16 16"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg>';
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'--:--';
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let current=null;

function draw(t){
  const c=t.canvas, dpr=window.devicePixelRatio||1, w=c.clientWidth, h=c.clientHeight;
  if(c.width!==w*dpr){c.width=w*dpr;c.height=h*dpr}
  const g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const p=PEAKS[t.id], n=p.length, bw=w/n, prog=t.audio.duration?t.audio.currentTime/t.audio.duration:0;
  for(let i=0;i<n;i++){
    const bh=Math.max(2,p[i]*(h-4));
    g.fillStyle=(i/n)<prog?css('--accent'):css('--wave');
    g.fillRect(i*bw+0.5,(h-bh)/2,Math.max(1,bw-1.5),bh);
  }
}

function build(list,el){
  list.forEach(d=>{
    const box=document.createElement('div'); box.className='track';
    box.innerHTML=`<button class="play" aria-label="播放 ${d.title}">${PLAY}</button>
      <div class="head"><div class="meta"><span class="title">${d.title}</span><span class="time">--:--</span></div>
      <div class="tags">${d.tags.map(x=>`<span class="tag">${x}</span>`).join('')}${d.note?`<span class="note">${d.note}</span>`:''}</div></div>
      <canvas class="wave" aria-label="${d.title} 进度条"></canvas>`;
    el.appendChild(box);
    const audio=new Audio(); audio.preload='metadata'; audio.src='audio/'+d.id+'.mp3';
    const t={id:d.id,box,audio,canvas:box.querySelector('canvas'),btn:box.querySelector('.play'),time:box.querySelector('.time')};
    const upd=()=>{t.time.textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration);draw(t)};
    audio.addEventListener('loadedmetadata',upd);
    audio.addEventListener('timeupdate',upd);
    audio.addEventListener('ended',()=>{t.btn.innerHTML=PLAY;box.classList.remove('playing')});
    t.btn.onclick=()=>{
      if(audio.paused){
        if(current&&current!==t){current.audio.pause();current.btn.innerHTML=PLAY;current.box.classList.remove('playing')}
        audio.play(); t.btn.innerHTML=PAUSE; box.classList.add('playing'); current=t;
      } else { audio.pause(); t.btn.innerHTML=PLAY; box.classList.remove('playing') }
    };
    t.canvas.onclick=e=>{
      const r=t.canvas.getBoundingClientRect(), f=(e.clientX-r.left)/r.width;
      const seek=()=>{audio.currentTime=f*audio.duration;upd()};
      audio.duration?seek():audio.addEventListener('loadedmetadata',seek,{once:true});
      if(audio.paused) t.btn.click();
    };
    window.addEventListener('resize',()=>draw(t));
    draw(t);
  });
}
build(TRACKS.arr,document.getElementById('arr'));
build(TRACKS.mix,document.getElementById('mix'));
